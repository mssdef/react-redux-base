version: "3"

tasks:
  default:
    desc: List all available tasks
    cmds:
      - task --list
    silent: true

  deps:
    desc: Install npm dependencies
    cmds:
      - npm install
    status:
      - test -x node_modules/.bin/react-scripts

  test:
    desc: Run unit tests once (CI mode)
    deps: [deps]
    env:
      CI: "true"
    cmds:
      - npm test -- --watchAll=false

  build:
    desc: Production build
    deps: [deps]
    cmds:
      - npm run build
